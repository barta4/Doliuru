apply plugin: 'com.android.application'

android {
    // API Level - See https://apilevels.com/
    // 16=4.1 17=4.2 19=4.4.2
    // 21=5.0.0 22=5.1.1 23=6.0.0 (android M, need permission requests)
    // 24=7.0.0 25=7.1.0 26=8.0.0 29=10.0.0 30=11.0.0 31=12.0.0 33=13.0.0
    // 34=14.0.0 35=15.0.0
    defaultConfig {
        applicationId "com.nltechno.dolidroidpro"
        minSdkVersion 26
        targetSdkVersion 34
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            lintOptions {
                disable 'MissingTranslation'
            }
        }
    }

    // Add support for the org.apache.http package
    useLibrary 'org.apache.http.legacy'
    namespace 'com.nltechno.dolidroidpro'
    compileSdk 34
}

dependencies {
    // Add entry to be able to use androidx.core.content.FileProvider to use Provider for file upload of camera capture on Android >= 30
    implementation 'androidx.core:core:1.10.1'

    // Add swiper to allow to refresh of a web page with a screen swipe bottom
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // Dependencias para el uso de Google Maps y servicios de ubicación
    implementation 'com.google.android.gms:play-services-maps:18.0.2'
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // Dependencias para manejo de encriptación y autenticación de app
    implementation "androidx.security:security-crypto:1.0.0"
    implementation "androidx.security:security-identity-credential:1.0.0-alpha03"
    implementation "androidx.security:security-app-authenticator:1.0.0-alpha02"
    androidTestImplementation "androidx.security:security-app-authenticator:1.0.0-alpha02"
}
